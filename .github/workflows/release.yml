name: Mizan Release Pipeline

# Faqat 'release' branchiga push (yoki merge) qilinganda ishga tushadi
on:
  push:
    branches:
      - release

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodni yuklab olish (Checkout)
        uses: actions/checkout@v4

      - name: ☕ Java JDK ni o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Loyihangizdagi Java versiyasiga moslang

      - name: 🐘 Gradle'ni sozlash
        uses: gradle/gradle-build-action@v3

      # Keystore faylini Base64'dan tiklash
      - name: 🔐 Keystore'ni tiklash
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/keystore.jks

      # 1. Firebase uchun APK yig'ish (odatda testing uchun APK qulayroq)
      - name: 📦 Firebase uchun APK Build qilish
        run: ./gradlew assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      # 2. Firebase App Distribution ga yuborish
      - name: 🔥 Firebase App Distribution-ga yuklash
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers # Firebase'dagi testerlar guruhi nomi
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Yangi versiya 'release' branchidan avtomatik yuklandi."

      # 3. Play Console uchun AAB yig'ish (Play Market aab talab qiladi)
      - name: 📦 Play Console uchun AAB Build qilish
        run: ./gradlew bundleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      # 4. Google Play Console Internal Testing ga yuborish
      - name: 🚀 Google Play Console-ga yuklash
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
          packageName: uz.mizan.app # Ilovangizning package nomi
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal # internal, alpha, beta, yoki production
          status: completed